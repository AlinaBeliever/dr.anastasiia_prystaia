# Netlify: публікуємо папку site/, без збірки.
[build]
  publish = "site"

# ПРОТОТИП: поки Анастасія не погодила публікацію (фото, тексти), не пускаємо пошуковики.
# Перед публічним запуском ВИДАЛИТИ цей блок [[headers]] з X-Robots-Tag.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Службові файли (звіти, питання) не віддаємо публічно
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true
